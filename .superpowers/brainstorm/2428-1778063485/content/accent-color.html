<h2>ボタンの色（アクセントカラー）はどれにしますか？</h2>
<p class="subtitle">「実行する」「ファイルを選択」などのボタン色です。CustomTkinterの標準色から選べます。</p>

<div class="cards">

  <div class="card" data-choice="blue" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#222;padding:20px;border-radius:8px;font-family:sans-serif;text-align:center;">
      <div style="display:inline-flex;flex-direction:column;gap:10px;align-items:center;">
        <div style="background:#1f6feb;color:#fff;border-radius:8px;padding:9px 32px;font-size:13px;font-weight:bold;">実行する</div>
        <div style="background:#1f6feb;color:#fff;border-radius:8px;padding:7px 20px;font-size:12px;">ファイルを選択</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <div style="width:16px;height:16px;border-radius:4px;background:#1f6feb;"></div>
          <span style="color:#ddd;font-size:12px;">重複データを削除</span>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>ブルー（青）</h3>
      <p>清潔感があり信頼感もある。ビジネス向きで使いやすい。</p>
    </div>
  </div>

  <div class="card" data-choice="green" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#222;padding:20px;border-radius:8px;font-family:sans-serif;text-align:center;">
      <div style="display:inline-flex;flex-direction:column;gap:10px;align-items:center;">
        <div style="background:#2d7a2d;color:#fff;border-radius:8px;padding:9px 32px;font-size:13px;font-weight:bold;">実行する</div>
        <div style="background:#2d7a2d;color:#fff;border-radius:8px;padding:7px 20px;font-size:12px;">ファイルを選択</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <div style="width:16px;height:16px;border-radius:4px;background:#2d7a2d;"></div>
          <span style="color:#ddd;font-size:12px;">重複データを削除</span>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>グリーン（緑）</h3>
      <p>「実行・完了」のイメージ。Excelっぽい雰囲気にもなる。</p>
    </div>
  </div>

  <div class="card" data-choice="dark-blue" onclick="toggleSelect(this)">
    <div class="card-image" style="background:#222;padding:20px;border-radius:8px;font-family:sans-serif;text-align:center;">
      <div style="display:inline-flex;flex-direction:column;gap:10px;align-items:center;">
        <div style="background:#1a3a6e;color:#fff;border-radius:8px;padding:9px 32px;font-size:13px;font-weight:bold;">実行する</div>
        <div style="background:#1a3a6e;color:#fff;border-radius:8px;padding:7px 20px;font-size:12px;">ファイルを選択</div>
        <div style="display:flex;gap:8px;align-items:center;">
          <div style="width:16px;height:16px;border-radius:4px;background:#1a3a6e;"></div>
          <span style="color:#ddd;font-size:12px;">重複データを削除</span>
        </div>
      </div>
    </div>
    <div class="card-body">
      <h3>ダークブルー（濃紺）</h3>
      <p>落ち着いた高級感。ポートフォリオとして見栄えがいい。</p>
    </div>
  </div>

</div>
